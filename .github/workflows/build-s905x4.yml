name: ST4 - OpenWrt S905X4 Custom Kernel 6.6.66

on:
  workflow_dispatch:
    inputs:

      img_url:
        description: "URL firmware sumber (.img, .img.gz, .img.xz)"
        required: true
        type: string

      dtb:
        description: "DTB S905X4"
        required: true
        default: "meson-sc2-s905x4-gbit.dtb"
        type: string

      builder_name:
        description: "Nama builder"
        required: false
        default: "ST4NGKUDUT-S905X4"
        type: string

env:
  TZ: Asia/Jakarta
  KERNEL_VERSION: "6.6.66"
  KERNEL_DIR: "custom-kernel/6.6.66"

jobs:

  # ============================================================
  # PREPARE
  # ============================================================

  prepare:
    name: Prepare S905X4 firmware
    runs-on: ubuntu-22.04

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # CHECK CUSTOM KERNEL
      # ----------------------------------------------------------

      - name: 2. Check custom kernel archives
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CUSTOM KERNEL 6.6.66"
          echo "=========================================="

          REQUIRED_FILES=(
            "${KERNEL_DIR}/boot-6.6.66.tar.gz"
            "${KERNEL_DIR}/dtb-amlogic-6.6.66.tar.gz"
            "${KERNEL_DIR}/modules-6.6.66.tar.gz"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::File tidak ditemukan: $FILE"
              exit 1
            fi

            echo
            echo "OK:"
            ls -lh "$FILE"
          done

      # ----------------------------------------------------------
      # DEPENDENCIES
      # ----------------------------------------------------------

      - name: 3. Install dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            curl \
            wget \
            file \
            gzip \
            xz-utils \
            tar \
            rsync \
            util-linux \
            kmod \
            e2fsprogs \
            dosfstools \
            u-boot-tools \
            device-tree-compiler \
            p7zip-full \
            pigz

          sudo timedatectl set-timezone "$TZ"

      # ----------------------------------------------------------
      # DOWNLOAD SOURCE IMAGE
      # ----------------------------------------------------------

      - name: 4. Download source firmware
        shell: bash
        env:
          IMG_URL: ${{ inputs.img_url }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " DOWNLOAD SOURCE IMAGE"
          echo "=========================================="

          echo "$IMG_URL"

          curl \
            -fL \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            "$IMG_URL" \
            -o source_file.download

          echo
          echo "Download selesai:"
          ls -lh source_file.download

          echo
          echo "File type:"
          file source_file.download

      # ----------------------------------------------------------
      # DECOMPRESS
      # ----------------------------------------------------------

      - name: 5. Detect and decompress source image
        shell: bash
        run: |
          set -euo pipefail

          FILE_TYPE="$(file -b source_file.download)"

          echo "Detected:"
          echo "$FILE_TYPE"

          case "$FILE_TYPE" in

            *"gzip compressed data"*)

              echo "GZIP terdeteksi."

              mv \
                source_file.download \
                source_file.img.gz

              gunzip \
                source_file.img.gz

              ;;

            *"XZ compressed data"*)

              echo "XZ terdeteksi."

              mv \
                source_file.download \
                source_file.img.xz

              unxz \
                source_file.img.xz

              ;;

            *"boot sector"*|*"disk image"*|*"DOS/MBR"*|*"GPT"*)

              echo "IMG mentah terdeteksi."

              mv \
                source_file.download \
                source_file.img

              ;;

            *)

              echo "::error::Format source image tidak dikenal."
              echo "$FILE_TYPE"

              exit 1

              ;;

          esac

          if [ ! -f source_file.img ]; then
            echo "::error::source_file.img tidak ditemukan."
            exit 1
          fi

          echo
          echo "Source image:"
          ls -lh source_file.img

          echo
          file source_file.img

      # ----------------------------------------------------------
      # LOOP DEVICE
      #
      # INI MENIRU WORKFLOW LAMA.
      # TIDAK MENGGUNAKAN parted SEBAGAI SYARAT.
      # ----------------------------------------------------------

      - name: 6. Attach source image exactly like old workflow
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " ATTACH IMAGE"
          echo "=========================================="

          LOOPDEV="$(
            sudo losetup \
              -fP \
              --show \
              source_file.img
          )"

          echo "LOOPDEV=$LOOPDEV"

          echo "LOOPDEV=$LOOPDEV" >> "$GITHUB_ENV"

          sleep 2

          echo
          echo "Loop devices:"

          ls -l \
            "${LOOPDEV}"* \
            2>/dev/null || true

          echo
          echo "lsblk:"

          lsblk \
            -o NAME,PATH,SIZE,FSTYPE,LABEL,PARTLABEL,PARTTYPE,MOUNTPOINT \
            "$LOOPDEV" \
            || true

          echo
          echo "Partitions generated by losetup:"

          for P in "${LOOPDEV}"p*; do
            if [ -b "$P" ]; then
              echo "$P"
            fi
          done

      # ----------------------------------------------------------
      # EXTRACT ROOTFS
      #
      # EXACT OLD METHOD:
      # ${LOOPDEV}p2
      # ----------------------------------------------------------

      - name: 7. Extract RootFS from partition p2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " EXTRACT ROOTFS FROM P2"
          echo "=========================================="

          mkdir -p \
            rootfs_mount \
            extracted-rootfs

          ROOT_PART="${LOOPDEV}p2"

          echo "Expected rootfs:"
          echo "$ROOT_PART"

          if [ ! -b "$ROOT_PART" ]; then

            echo
            echo "::error::Partition p2 tidak dibuat oleh losetup."

            echo
            echo "=========================================="
            echo " IMAGE DEBUG"
            echo "=========================================="

            echo
            echo "--- file ---"
            file source_file.img

            echo
            echo "--- size ---"
            ls -lh source_file.img

            echo
            echo "--- loop ---"
            sudo losetup -l "$LOOPDEV" || true

            echo
            echo "--- lsblk ---"
            lsblk \
              -a \
              -o NAME,PATH,SIZE,FSTYPE,LABEL,PARTLABEL,PARTTYPE,MOUNTPOINT \
              "$LOOPDEV" \
              || true

            echo
            echo "--- fdisk ---"
            sudo fdisk -l "$LOOPDEV" || true

            echo
            echo "--- blkid ---"
            sudo blkid "$LOOPDEV" || true

            echo
            echo "--- signatures ---"

            sudo blkid -p "$LOOPDEV" || true

            echo
            echo "--- first 4 KiB ---"

            sudo dd \
              if=source_file.img \
              bs=4096 \
              count=1 \
              2>/dev/null \
              | xxd

            exit 1
          fi

          echo
          echo "RootFS partition ditemukan:"
          ls -lh "$ROOT_PART"

          # ------------------------------------------------------
          # MOUNT ROOTFS
          # ------------------------------------------------------

          sudo mount \
            "$ROOT_PART" \
            rootfs_mount

          echo
          echo "RootFS berhasil di-mount."

          echo
          echo "RootFS:"
          sudo ls -lah rootfs_mount

          # ------------------------------------------------------
          # CREATE ROOTFS TAR
          #
          # Tidak menggunakan find | head.
          # ------------------------------------------------------

          echo
          echo "Membuat archive rootfs..."

          sudo tar \
            -C rootfs_mount \
            -czf \
            extracted-rootfs/openwrt-rootfs.tar.gz \
            .

          sudo chown \
            "$(id -u):$(id -g)" \
            extracted-rootfs/openwrt-rootfs.tar.gz

          echo
          ls -lh \
            extracted-rootfs/openwrt-rootfs.tar.gz

      # ----------------------------------------------------------
      # UPLOAD ROOTFS
      # ----------------------------------------------------------

      - name: 8. Upload RootFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: s905x4-rootfs
          retention-days: 1
          path: extracted-rootfs/openwrt-rootfs.tar.gz

      # ----------------------------------------------------------
      # EXTRACT CUSTOM KERNEL
      # ----------------------------------------------------------

      - name: 9. Extract custom kernel 6.6.66
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " EXTRACT CUSTOM KERNEL"
          echo "=========================================="

          rm -rf \
            kernel-files \
            dtb-files \
            modules-files

          mkdir -p \
            kernel-files \
            dtb-files \
            modules-files

          tar \
            -xzf \
            "${KERNEL_DIR}/boot-6.6.66.tar.gz" \
            -C kernel-files

          tar \
            -xzf \
            "${KERNEL_DIR}/dtb-amlogic-6.6.66.tar.gz" \
            -C dtb-files

          tar \
            -xzf \
            "${KERNEL_DIR}/modules-6.6.66.tar.gz" \
            -C modules-files

          echo
          echo "=== KERNEL ==="

          find \
            kernel-files \
            -type f \
            -print \
            | sort

          echo
          echo "=== DTB ==="

          find \
            dtb-files \
            -type f \
            -name "*.dtb" \
            -print \
            | sort

          echo
          echo "=== MODULES ==="

          find \
            modules-files \
            -type f \
            -name "*.ko*" \
            -print \
            | sort \
            | sed -n '1,100p'

      # ----------------------------------------------------------
      # VERIFY CUSTOM KERNEL
      # ----------------------------------------------------------

      - name: 10. Verify custom kernel
        shell: bash
        run: |
          set -euo pipefail

          VMLINUZ="$(
            find \
              kernel-files \
              -type f \
              -name "vmlinuz-6.6.66" \
              -print \
              -quit
          )"

          if [ -z "$VMLINUZ" ]; then
            echo "::error::vmlinuz-6.6.66 tidak ditemukan."
            exit 1
          fi

          DTB="$(
            find \
              dtb-files \
              -type f \
              -name "${{ inputs.dtb }}" \
              -print \
              -quit
          )"

          if [ -z "$DTB" ]; then
            echo "::error::DTB tidak ditemukan:"
            echo "${{ inputs.dtb }}"

            echo
            echo "DTB tersedia:"

            find \
              dtb-files \
              -type f \
              -name "*.dtb" \
              -print \
              | sort

            exit 1
          fi

          if [ ! -d "modules-files/6.6.66" ]; then
            echo "::error::modules-files/6.6.66 tidak ditemukan."
            exit 1
          fi

          MODULE_COUNT="$(
            find \
              modules-files/6.6.66 \
              -type f \
              -name "*.ko*" \
              -print \
              | wc -l
          )"

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "::error::Tidak ada module kernel."
            exit 1
          fi

          echo
          echo "Kernel:"
          ls -lh "$VMLINUZ"

          echo
          echo "DTB:"
          ls -lh "$DTB"

          echo
          echo "Modules:"
          echo "$MODULE_COUNT"

      # ----------------------------------------------------------
      # INSTALL CUSTOM KERNEL
      #
      # ROOTFS MASIH MOUNTED.
      # BOOT BELUM DIMODIFIKASI DI SINI.
      # ----------------------------------------------------------

      - name: 11. Install modules into OpenWrt rootfs
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " INSTALL MODULES 6.6.66"
          echo "=========================================="

          sudo mkdir -p \
            rootfs_mount/lib/modules/6.6.66

          sudo rsync \
            -a \
            modules-files/6.6.66/ \
            rootfs_mount/lib/modules/6.6.66/

          echo
          echo "Module count installed:"

          find \
            rootfs_mount/lib/modules/6.6.66 \
            -type f \
            -name "*.ko*" \
            -print \
            | wc -l

      # ----------------------------------------------------------
      # INSTALL KERNEL INTO ROOTFS /BOOT
      # ----------------------------------------------------------

      - name: 12. Install kernel 6.6.66 into rootfs boot
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " INSTALL KERNEL 6.6.66"
          echo "=========================================="

          sudo mkdir -p \
            rootfs_mount/boot

          VMLINUZ="$(
            find \
              kernel-files \
              -type f \
              -name "vmlinuz-6.6.66" \
              -print \
              -quit
          )"

          sudo cp \
            -f \
            "$VMLINUZ" \
            rootfs_mount/boot/vmlinuz-6.6.66

          SYSTEM_MAP="$(
            find \
              kernel-files \
              -type f \
              -name "System.map-6.6.66" \
              -print \
              -quit
          )"

          if [ -n "$SYSTEM_MAP" ]; then
            sudo cp \
              -f \
              "$SYSTEM_MAP" \
              rootfs_mount/boot/System.map-6.6.66
          fi

          CONFIG_FILE="$(
            find \
              kernel-files \
              -type f \
              -name "config-6.6.66" \
              -print \
              -quit
          )"

          if [ -n "$CONFIG_FILE" ]; then
            sudo cp \
              -f \
              "$CONFIG_FILE" \
              rootfs_mount/boot/config-6.6.66
          fi

          echo
          echo "Installed:"
          sudo ls -lh \
            rootfs_mount/boot/*6.6.66* \
            2>/dev/null || true

      # ----------------------------------------------------------
      # GENERATE DEPMOD
      # ----------------------------------------------------------

      - name: 13. Generate module dependency
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating depmod..."

          if [ -x rootfs_mount/sbin/depmod ]; then

            sudo chroot \
              rootfs_mount \
              /sbin/depmod \
              -a \
              6.6.66 \
              || true

          else

            sudo depmod \
              -b rootfs_mount \
              6.6.66 \
              || true

          fi

          echo
          echo "Module metadata:"

          sudo find \
            rootfs_mount/lib/modules/6.6.66 \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      # ----------------------------------------------------------
      # CHECK AP633I / BROADCOM
      # ----------------------------------------------------------

      - name: 14. Check AP633i Broadcom WiFi support
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " AP633i / BRCMFMAC"
          echo "=========================================="

          echo
          echo "brcmfmac modules:"

          find \
            rootfs_mount/lib/modules/6.6.66 \
            -type f \
            \( \
              -name "brcmfmac*.ko" \
              -o \
              -name "brcmutil*.ko" \
            \) \
            -print \
            | sort

          echo
          echo "Broadcom firmware:"

          find \
            rootfs_mount \
            -type f \
            \( \
              -name "brcmfmac*.bin" \
              -o \
              -name "brcmfmac*.txt" \
              -o \
              -name "brcmfmac*.clm_blob" \
            \) \
            -print \
            | sort \
            | sed -n '1,200p'

      # ----------------------------------------------------------
      # REPACK ROOTFS
      # ----------------------------------------------------------

      - name: 15. Repack modified rootfs
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " REPACK ROOTFS"
          echo "=========================================="

          sudo tar \
            -C rootfs_mount \
            -czf \
            openwrt-rootfs-s905x4-6.6.66.tar.gz \
            .

          sudo chown \
            "$(id -u):$(id -g)" \
            openwrt-rootfs-s905x4-6.6.66.tar.gz

          ls -lh \
            openwrt-rootfs-s905x4-6.6.66.tar.gz

      # ----------------------------------------------------------
      # UNMOUNT ROOTFS
      # ----------------------------------------------------------

      - name: 16. Unmount rootfs
        if: always()
        shell: bash
        run: |
          set +e

          sync

          sudo umount \
            rootfs_mount \
            2>/dev/null \
            || true

          if [ -n "${LOOPDEV:-}" ]; then
            sudo losetup \
              -d \
              "$LOOPDEV" \
              2>/dev/null \
              || true
          fi

      # ----------------------------------------------------------
      # UPLOAD MODIFIED ROOTFS
      # ----------------------------------------------------------

      - name: 17. Upload modified rootfs
        uses: actions/upload-artifact@v4
        with:
          name: S905X4-rootfs-custom-6.6.66
          retention-days: 14
          path: openwrt-rootfs-s905x4-6.6.66.tar.gz

      # ----------------------------------------------------------
      # CLEANUP
      # ----------------------------------------------------------

      - name: 18. Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          sudo umount rootfs_mount 2>/dev/null || true

          if [ -n "${LOOPDEV:-}" ]; then
            sudo losetup -d "$LOOPDEV" 2>/dev/null || true
          fi
