name: ST4Porting S905X4 OpenWrt - Custom Kernel 6.6.66

on:
workflow_dispatch:
inputs:
img_url:
description: "URL firmware sumber (.img, .img.gz, .img.xz)"
required: true
type: string

```
  openwrt_board:
    description: "Board OpenWrt / Amlogic"
    required: true
    type: choice
    default: s905x4
    options:
      - s905x4
      - all

  dtb:
    description: "DTB S905X4"
    required: true
    type: choice
    default: meson-sc2-s905x4-gbit.dtb
    options:
      - meson-sc2-s905x4-gbit.dtb
      - meson-sc2-s905x4-ah212.dtb

  builder_name:
    description: "Nama builder"
    required: false
    default: "ST4NGKUDUT"
    type: string
```

env:
TZ: Asia/Jakarta
KERNEL_VERSION: 6.6.66
KERNEL_DIR: custom-kernel/6.6.66

jobs:

prepare:
name: Prepare OpenWrt RootFS
runs-on: ubuntu-22.04

```
if: ${{ github.event.repository.owner.id == github.event.sender.id }}

outputs:
  date: ${{ steps.date.outputs.date }}

steps:

  - name: 1. Checkout Code
    uses: actions/checkout@v4

  - name: 2. Verify Custom Kernel
    shell: bash
    run: |
      set -euo pipefail

      echo "=== Custom kernel directory ==="
      find "$KERNEL_DIR" -maxdepth 3 -type f -print | sort

      for f in \
        boot-6.6.66.tar.gz \
        dtb-amlogic-6.6.66.tar.gz \
        modules-6.6.66.tar.gz
      do
        if [ ! -f "$KERNEL_DIR/$f" ]; then
          echo "::error::Missing $KERNEL_DIR/$f"
          exit 1
        fi

        echo "OK: $KERNEL_DIR/$f"
        ls -lh "$KERNEL_DIR/$f"
      done

  - name: 3. Initialize Build Environment
    env:
      DEBIAN_FRONTEND: noninteractive
    shell: bash
    run: |
      set -euo pipefail

      sudo rm -rf \
        /usr/share/dotnet \
        /usr/local/lib/android \
        /opt/ghc \
        /usr/local/share/powershell \
        /usr/lib/jvm \
        || true

      sudo swapoff -a || true
      sudo rm -f /swapfile /mnt/swapfile || true

      sudo apt-get update

      sudo apt-get install -y --no-install-recommends \
        curl \
        wget \
        file \
        gzip \
        xz-utils \
        tar \
        p7zip-full \
        util-linux \
        e2fsprogs \
        dosfstools \
        parted \
        rsync \
        u-boot-tools \
        python3 \
        python3-pip \
        jq \
        bc \
        bison \
        flex \
        build-essential \
        device-tree-compiler

      sudo timedatectl set-timezone "$TZ"

      python3 -m pip install --upgrade pip

      python3 -m pip install \
        gdown

  - name: 4. Download Source Firmware
    shell: bash
    run: |
      set -euo pipefail

      URL='${{ inputs.img_url }}'

      echo "========================================"
      echo "Downloading source firmware"
      echo "========================================"
      echo "$URL"

      if [[ "$URL" == *"drive.google.com"* ]]; then

        gdown \
          "$URL" \
          -O source_file.download

      else

        wget \
          --no-check-certificate \
          --progress=dot:giga \
          --tries=5 \
          --timeout=60 \
          "$URL" \
          -O source_file.download

      fi

      test -s source_file.download

      echo
      echo "=== Downloaded file ==="
      ls -lh source_file.download

      echo
      echo "=== File type ==="
      file source_file.download

  - name: 5. Detect and Decompress Firmware
    shell: bash
    run: |
      set -euo pipefail

      FILE_TYPE="$(file -b source_file.download)"

      echo "Detected:"
      echo "$FILE_TYPE"

      case "$FILE_TYPE" in

        *"gzip compressed data"*)

          echo "GZIP detected"

          mv \
            source_file.download \
            source_file.img.gz

          gunzip \
            source_file.img.gz

          ;;

        *"XZ compressed data"*)

          echo "XZ detected"

          mv \
            source_file.download \
            source_file.img.xz

          unxz \
            source_file.img.xz

          ;;

        *"DOS/MBR boot sector"*|*"GPT"*)
          
          echo "Raw image detected"

          mv \
            source_file.download \
            source_file.img

          ;;

        *"boot sector"*)

          echo "Raw image detected"

          mv \
            source_file.download \
            source_file.img

          ;;

        *)

          echo "::error::Unknown firmware format"
          echo "$FILE_TYPE"
          exit 1

          ;;

      esac

      test -f source_file.img
      test -s source_file.img

      echo
      echo "=== Final source image ==="
      file source_file.img
      ls -lh source_file.img

  - name: 6. Inspect Source Image
    shell: bash
    run: |
      set -euo pipefail

      LOOPDEV="$(sudo losetup -fP --show source_file.img)"

      echo "LOOPDEV=$LOOPDEV" >> "$GITHUB_ENV"

      echo
      echo "=== Partition table ==="

      sudo fdisk -l "$LOOPDEV" || true

      echo
      echo "=== lsblk ==="

      lsblk -f "$LOOPDEV" || true

  - name: 7. Extract OpenWrt RootFS
    shell: bash
    run: |
      set -euo pipefail

      sudo mkdir -p rootfs_mount extracted-rootfs

      test -b "${LOOPDEV}p2" || {
        echo "::error::RootFS partition p2 not found"
        exit 1
      }

      sudo mount \
        "${LOOPDEV}p2" \
        rootfs_mount

      echo "=== Source rootfs ==="

      sudo ls -lah rootfs_mount

      echo
      echo "=== Creating rootfs archive ==="

      sudo tar \
        --numeric-owner \
        -czf \
        extracted-rootfs/openwrt-rootfs.tar.gz \
        -C rootfs_mount \
        .

      sudo chown \
        "$(id -u):$(id -g)" \
        extracted-rootfs/openwrt-rootfs.tar.gz

      sudo umount rootfs_mount

      sudo losetup -d "$LOOPDEV"

      unset LOOPDEV

      echo
      echo "=== RootFS archive ==="

      ls -lh \
        extracted-rootfs/openwrt-rootfs.tar.gz

  - name: 8. Upload RootFS Artifact
    uses: actions/upload-artifact@v4
    with:
      name: openwrt-rootfs
      path: extracted-rootfs/openwrt-rootfs.tar.gz
      if-no-files-found: error

  - name: 9. Get Build Date
    id: date
    shell: bash
    run: |
      echo "date=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

  - name: 10. Cleanup
    if: always()
    shell: bash
    run: |
      set +e

      sudo umount rootfs_mount 2>/dev/null || true

      if [ -n "${LOOPDEV:-}" ]; then
        sudo losetup -d "$LOOPDEV" 2>/dev/null || true
      fi
```

build:
name: Build ${{ inputs.openwrt_board }} / S905X4 / 6.6.66
runs-on: ubuntu-22.04

```
if: ${{ github.event.repository.owner.id == github.event.sender.id }}

needs:
  - prepare

steps:

  - name: 1. Checkout Repository
    uses: actions/checkout@v4

  - name: 2. Download RootFS Artifact
    uses: actions/download-artifact@v4
    with:
      name: openwrt-rootfs
      path: rootfs

  - name: 3. Verify RootFS
    shell: bash
    run: |
      set -euo pipefail

      test -f rootfs/openwrt-rootfs.tar.gz

      ls -lh \
        rootfs/openwrt-rootfs.tar.gz

  - name: 4. Verify Custom Kernel
    shell: bash
    run: |
      set -euo pipefail

      for f in \
        boot-6.6.66.tar.gz \
        dtb-amlogic-6.6.66.tar.gz \
        modules-6.6.66.tar.gz
      do
        test -f "$KERNEL_DIR/$f"
      done

      echo "Custom kernel 6.6.66:"
      du -h "$KERNEL_DIR"/*

  - name: 5. Prepare Custom Kernel Files
    shell: bash
    run: |
      set -euo pipefail

      rm -rf \
        kernel-files \
        dtb-files \
        modules-files

      mkdir -p \
        kernel-files \
        dtb-files \
        modules-files

      tar \
        -xzf \
        "$KERNEL_DIR/boot-6.6.66.tar.gz" \
        -C kernel-files

      tar \
        -xzf \
        "$KERNEL_DIR/dtb-amlogic-6.6.66.tar.gz" \
        -C dtb-files

      tar \
        -xzf \
        "$KERNEL_DIR/modules-6.6.66.tar.gz" \
        -C modules-files

      echo "=== Kernel ==="

      find \
        kernel-files \
        -type f \
        -print \
        | sort

      echo
      echo "=== DTB ==="

      find \
        dtb-files \
        -type f \
        -name '*.dtb' \
        -print \
        | sort

      echo
      echo "=== Modules ==="

      find \
        modules-files \
        -type f \
        | head -100

  - name: 6. Locate Custom DTB
    shell: bash
    run: |
      set -euo pipefail

      DTB_PATH="$(
        find \
          dtb-files \
          -type f \
          -name '${{ inputs.dtb }}' \
          -print \
          | head -n 1
      )"

      if [ -z "$DTB_PATH" ]; then
        echo "::error::DTB '${{ inputs.dtb }}' not found"
        exit 1
      fi

      echo "DTB_PATH=$DTB_PATH" >> "$GITHUB_ENV"

      echo "Selected DTB:"
      echo "$DTB_PATH"

  - name: 7. Prepare Custom Files Overlay
    shell: bash
    run: |
      set -euo pipefail

      rm -rf custom-overlay

      mkdir -p \
        custom-overlay/boot \
        custom-overlay/lib/modules/6.6.66 \
        custom-overlay/dtb/amlogic

      echo "=== Detecting kernel files ==="

      KROOT="$(
        find \
          kernel-files \
          -maxdepth 3 \
          -type d \
          -name 'boot-6.6.66' \
          -print \
          | head -n 1 \
      )"

      if [ -z "$KROOT" ]; then
        KROOT="kernel-files"
      fi

      echo "Kernel root: $KROOT"

      find \
        "$KROOT" \
        -maxdepth 2 \
        -type f \
        -print

      echo
      echo "=== Copy kernel ==="

      for f in \
        vmlinuz-6.6.66 \
        uInitrd-6.6.66 \
        initrd.img-6.6.66 \
        config-6.6.66 \
        System.map-6.6.66
      do

        if [ -f "$KROOT/$f" ]; then

          cp \
            -f \
            "$KROOT/$f" \
            custom-overlay/boot/

          echo "Installed: $f"

        fi

      done

      echo
      echo "=== Copy DTB ==="

      cp \
        -f \
        "$DTB_PATH" \
        custom-overlay/boot/${{ inputs.dtb }}

      cp \
        -f \
        "$DTB_PATH" \
        custom-overlay/dtb/amlogic/${{ inputs.dtb }}

      echo
      echo "=== Copy modules ==="

      test -d modules-files/6.6.66

      rsync \
        -a \
        modules-files/6.6.66/ \
        custom-overlay/lib/modules/6.6.66/

      echo
      echo "=== Custom overlay ==="

      find \
        custom-overlay \
        -type f \
        -printf '%p %k KB\n' \
        | sort

  - name: 8. Prepare OpenWrt Packaging Environment
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p \
        package-rootfs \
        output

      tar \
        -xzf \
        rootfs/openwrt-rootfs.tar.gz \
        -C package-rootfs

      echo "=== RootFS ==="

      ls -lah package-rootfs

  - name: 9. Install Custom Kernel into RootFS
    shell: bash
    run: |
      set -euo pipefail

      echo "=== Installing modules ==="

      sudo mkdir -p \
        package-rootfs/lib/modules/6.6.66

      sudo rsync \
        -a \
        custom-overlay/lib/modules/6.6.66/ \
        package-rootfs/lib/modules/6.6.66/

      echo
      echo "=== Installing DTB ==="

      sudo mkdir -p \
        package-rootfs/boot/dtb/amlogic

      sudo cp \
        -f \
        "$DTB_PATH" \
        package-rootfs/boot/dtb/amlogic/${{ inputs.dtb }}

      sudo cp \
        -f \
        "$DTB_PATH" \
        package-rootfs/boot/${{ inputs.dtb }}

      echo
      echo "=== RootFS kernel modules ==="

      find \
        package-rootfs/lib/modules/6.6.66 \
        -type f \
        | head -100

  - name: 10. Build RootFS Archive with Custom Kernel
    shell: bash
    run: |
      set -euo pipefail

      tar \
        --numeric-owner \
        -czf \
        output/openwrt-rootfs-custom-6.6.66.tar.gz \
        -C package-rootfs \
        .

      ls -lh \
        output/openwrt-rootfs-custom-6.6.66.tar.gz

  - name: 11. Download Amlogic Packaging Tool
    shell: bash
    run: |
      set -euo pipefail

      git clone \
        --depth 1 \
        https://github.com/ophub/amlogic-s9xxx-openwrt.git \
        amlogic-s9xxx-openwrt

  - name: 12. Inspect Amlogic Packaging Tool
    shell: bash
    run: |
      set -euo pipefail

      echo "=== Packaging tool ==="

      ls -lah \
        amlogic-s9xxx-openwrt

      echo
      echo "=== remake ==="

      sed -n '1,220p' \
        amlogic-s9xxx-openwrt/remake

  - name: 13. Package OpenWrt
    shell: bash
    run: |
      set -euo pipefail

      cd amlogic-s9xxx-openwrt

      chmod +x remake

      echo "========================================"
      echo "Board : ${{ inputs.openwrt_board }}"
      echo "DTB   : ${{ inputs.dtb }}"
      echo "Kernel: 6.6.66"
      echo "Builder: ${{ inputs.builder_name }}"
      echo "========================================"

      ./remake \
        -b "${{ inputs.openwrt_board }}" \
        -k 6.6.66 \
        -a false \
        -u stable \
        -n "${{ inputs.builder_name }}" \
        -i "${{ github.workspace }}/output/openwrt-rootfs-custom-6.6.66.tar.gz"

  - name: 14. Locate Packaged Firmware
    shell: bash
    run: |
      set -euo pipefail

      echo "=== Searching output ==="

      find \
        amlogic-s9xxx-openwrt \
        -type f \
        \( \
          -name '*.img' \
          -o \
          -name '*.img.gz' \
          -o \
          -name '*.img.xz' \
          -o \
          -name '*.tar.gz' \
        \) \
        -print \
        | sort

  - name: 15. Collect Firmware
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p firmware

      find \
        amlogic-s9xxx-openwrt \
        -type f \
        \( \
          -name '*.img' \
          -o \
          -name '*.img.gz' \
          -o \
          -name '*.img.xz' \
        \) \
        -exec cp -f {} firmware/ \;

      test "$(find firmware -type f | wc -l)" -gt 0

      echo "=== Final firmware ==="

      ls -lh firmware

  - name: 16. Generate SHA256
    shell: bash
    run: |
      set -euo pipefail

      cd firmware

      sha256sum \
        * \
        | tee SHA256SUMS

  - name: 17. Upload Firmware Artifact
    uses: actions/upload-artifact@v4
    with:
      name: OpenWrt-S905X4-6.6.66-${{ inputs.dtb }}
      path: |
        firmware/*
      if-no-files-found: error

  - name: 18. Upload Custom Kernel Artifact
    uses: actions/upload-artifact@v4
    with:
      name: custom-kernel-6.6.66-${{ inputs.dtb }}
      path: |
        ${{ env.KERNEL_DIR }}/*.tar.gz
      if-no-files-found: error
```

release:
name: Publish GitHub Release
runs-on: ubuntu-22.04

```
if: ${{ github.event.repository.owner.id == github.event.sender.id }}

needs:
  - prepare
  - build

permissions:
  contents: write

steps:

  - name: 1. Download Firmware Artifact
    uses: actions/download-artifact@v4
    with:
      name: OpenWrt-S905X4-6.6.66-${{ inputs.dtb }}
      path: release

  - name: 2. Show Release Files
    shell: bash
    run: |
      set -euo pipefail

      find \
        release \
        -type f \
        -printf '%p %k KB\n' \
        | sort

  - name: 3. Publish Release
    uses: ncipollo/release-action@v1
    with:
      artifacts: "release/*"
      tag: "Build-${{ github.run_id }}"
      name: "OpenWrt S905X4 6.6.66 | ${{ inputs.dtb }}"
      body: |
        ## ST4Porting OpenWrt

        ### Build Information

        - Source firmware: `${{ inputs.img_url }}`
        - Target board: `${{ inputs.openwrt_board }}`
        - DTB: `${{ inputs.dtb }}`
        - Kernel: `6.6.66`
        - Kernel source: `custom-kernel/6.6.66`
        - Builder: `${{ inputs.builder_name }}`
        - Build date: `${{ needs.prepare.outputs.date }}`

        ### Custom Kernel

        This build uses the custom kernel files already stored in the repository.

        - `boot-6.6.66.tar.gz`
        - `dtb-amlogic-6.6.66.tar.gz`
        - `modules-6.6.66.tar.gz`

        The kernel is not downloaded from `ophub/kernel`.

      allowUpdates: true
      replacesArtifacts: true
      token: ${{ secrets.GITHUB_TOKEN }}
```
