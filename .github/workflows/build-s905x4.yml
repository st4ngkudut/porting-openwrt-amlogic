name: Build OpenWrt S905X4 Custom Kernel 6.6.66

on:
  workflow_dispatch:
    inputs:
      img_url:
        description: "URL firmware sumber (.img, .img.gz, .img.xz)"
        required: true
        type: string

      dtb:
        description: "DTB S905X4"
        required: true
        type: choice
        default: "meson-sc2-s905x4-gbit.dtb"
        options:
          - meson-sc2-s905x4-gbit.dtb
          - meson-sc2-s905x4-ah212.dtb

      builder_name:
        description: "Nama Builder"
        required: false
        default: "ST4NGKUDUT"
        type: string

env:
  TZ: Asia/Jakarta
  KERNEL_VERSION: "6.6.66"
  KERNEL_DIR: "custom-kernel/6.6.66"

jobs:

  # ==============================================================
  # PREPARE ROOTFS
  # ==============================================================

  prepare:
    name: Prepare S905X4 RootFS
    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # CHECK CUSTOM KERNEL
      # ------------------------------------------------------------

      - name: 2. Check custom kernel archives
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CUSTOM KERNEL 6.6.66"
          echo "=========================================="

          FILES=(
            "${KERNEL_DIR}/boot-6.6.66.tar.gz"
            "${KERNEL_DIR}/dtb-amlogic-6.6.66.tar.gz"
            "${KERNEL_DIR}/modules-6.6.66.tar.gz"
          )

          for FILE in "${FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::File tidak ditemukan: $FILE"
              exit 1
            fi

            echo
            echo "OK:"
            ls -lh "$FILE"
          done

      # ------------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------------

      - name: 3. Install dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true

          sudo swapoff -a || true
          sudo rm -f /swapfile || true

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            curl \
            wget \
            file \
            gzip \
            xz-utils \
            tar \
            rsync \
            p7zip-full \
            util-linux \
            kmod \
            e2fsprogs \
            dosfstools \
            u-boot-tools

          sudo timedatectl set-timezone "$TZ"

      # ------------------------------------------------------------
      # DOWNLOAD SOURCE IMAGE
      # ------------------------------------------------------------

      - name: 4. Download source firmware
        shell: bash
        run: |
          set -euo pipefail

          URL="${{ inputs.img_url }}"

          echo "=========================================="
          echo " DOWNLOAD SOURCE"
          echo "=========================================="

          echo "$URL"

          wget \
            --no-check-certificate \
            --tries=5 \
            --timeout=60 \
            "$URL" \
            -O source_file.download

          echo
          echo "Download selesai:"
          ls -lh source_file.download

          echo
          echo "Tipe file:"
          file source_file.download

      # ------------------------------------------------------------
      # DECOMPRESS
      # ------------------------------------------------------------

      - name: 5. Detect and decompress source image
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " DETECT SOURCE IMAGE"
          echo "=========================================="

          FILE_TYPE="$(file -b source_file.download)"

          echo "$FILE_TYPE"

          case "$FILE_TYPE" in

            *"gzip compressed data"*)

              echo "GZIP terdeteksi."

              mv \
                source_file.download \
                source_file.img.gz

              gunzip \
                source_file.img.gz

              ;;

            *"XZ compressed data"*)

              echo "XZ terdeteksi."

              mv \
                source_file.download \
                source_file.img.xz

              unxz \
                source_file.img.xz

              ;;

            *"boot sector"*)
              
              echo "IMG mentah terdeteksi."

              mv \
                source_file.download \
                source_file.img

              ;;

            *"disk image"*)

              echo "Disk image terdeteksi."

              mv \
                source_file.download \
                source_file.img

              ;;

            *)

              echo "::error::Format source image tidak dikenal."
              echo "$FILE_TYPE"

              exit 1

              ;;

          esac

          if [ ! -f source_file.img ]; then
            echo "::error::source_file.img tidak ditemukan."
            exit 1
          fi

          echo
          echo "Source image siap:"
          ls -lh source_file.img

          echo
          file source_file.img

      # ------------------------------------------------------------
      # EXTRACT ROOTFS EXACTLY LIKE OLD WORKFLOW
      # ------------------------------------------------------------

      - name: 6. Extract RootFS from partition p2
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " EXTRACT ROOTFS"
          echo "=========================================="

          mkdir -p \
            rootfs_mount \
            extracted-rootfs

          echo
          echo "Membuat loop device..."

          LOOPDEV="$(
            sudo losetup \
              -fP \
              --show \
              source_file.img
          )"

          echo "LOOPDEV=$LOOPDEV"

          echo "$LOOPDEV" > loopdev.txt

          sleep 2

          echo
          echo "Block device:"

          lsblk \
            -o NAME,PATH,SIZE,FSTYPE,LABEL,PARTLABEL,PARTTYPE,MOUNTPOINT \
            "$LOOPDEV" || true

          echo
          echo "Memeriksa p2..."

          if [ ! -b "${LOOPDEV}p2" ]; then
            echo "::error::Partition p2 tidak ditemukan."

            echo
            echo "fdisk:"
            sudo fdisk -l source_file.img || true

            echo
            echo "parted:"
            sudo parted source_file.img unit MiB print || true

            exit 1
          fi

          echo
          echo "Mount:"
          echo "${LOOPDEV}p2"

          sudo mount \
            "${LOOPDEV}p2" \
            rootfs_mount

          echo
          echo "RootFS berhasil di-mount."

          echo
          echo "Isi rootfs:"

          sudo find \
            rootfs_mount \
            -maxdepth 2 \
            -type d \
            -print \
            | sort \
            | sed -n '1,200p'

          # --------------------------------------------------------
          # Copy rootfs into archive.
          #
          # IMPORTANT:
          # Jangan gunakan find | head karena pipefail.
          # --------------------------------------------------------

          echo
          echo "Membuat openwrt-rootfs.tar.gz..."

          sudo tar \
            -C rootfs_mount \
            -czf extracted-rootfs/openwrt-rootfs.tar.gz \
            .

          sudo chown \
            "$(id -u):$(id -g)" \
            extracted-rootfs/openwrt-rootfs.tar.gz

          echo
          ls -lh \
            extracted-rootfs/openwrt-rootfs.tar.gz

          echo
          echo "Unmount rootfs..."

          sudo umount rootfs_mount

          sudo losetup \
            -d \
            "$LOOPDEV"

          rm -f loopdev.txt

          echo
          echo "RootFS extraction selesai."

      # ------------------------------------------------------------
      # UPLOAD ROOTFS
      # ------------------------------------------------------------

      - name: 7. Upload RootFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: s905x4-rootfs
          retention-days: 1
          path: extracted-rootfs/openwrt-rootfs.tar.gz

      # ------------------------------------------------------------
      # EXTRACT CUSTOM KERNEL
      # ------------------------------------------------------------

      - name: 8. Extract custom kernel 6.6.66
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " CUSTOM KERNEL 6.6.66"
          echo "=========================================="

          rm -rf \
            kernel-files \
            dtb-files \
            modules-files

          mkdir -p \
            kernel-files \
            dtb-files \
            modules-files

          echo
          echo "Extract boot archive..."

          tar \
            -xzf \
            "${KERNEL_DIR}/boot-6.6.66.tar.gz" \
            -C kernel-files

          echo
          echo "Extract DTB archive..."

          tar \
            -xzf \
            "${KERNEL_DIR}/dtb-amlogic-6.6.66.tar.gz" \
            -C dtb-files

          echo
          echo "Extract modules archive..."

          tar \
            -xzf \
            "${KERNEL_DIR}/modules-6.6.66.tar.gz" \
            -C modules-files

          echo
          echo "Kernel files:"

          find \
            kernel-files \
            -type f \
            -print \
            | sort

          echo
          echo "Selected DTB:"

          find \
            dtb-files \
            -type f \
            -name "${{ inputs.dtb }}" \
            -print

          echo
          echo "Modules sample:"

          find \
            modules-files \
            -type f \
            -print \
            | sort \
            | sed -n '1,100p'

      # ------------------------------------------------------------
      # VERIFY CUSTOM KERNEL
      # ------------------------------------------------------------

      - name: 9. Verify custom kernel contents
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " VERIFY CUSTOM KERNEL"
          echo "=========================================="

          # vmlinuz wajib ada
          VMLINUZ="$(
            find \
              kernel-files \
              -type f \
              -name "vmlinuz-6.6.66" \
              -print \
              -quit
          )"

          if [ -z "$VMLINUZ" ]; then
            echo "::error::vmlinuz-6.6.66 tidak ditemukan."
            exit 1
          fi

          echo
          echo "Kernel:"
          ls -lh "$VMLINUZ"

          # DTB wajib ada
          DTB="$(
            find \
              dtb-files \
              -type f \
              -name "${{ inputs.dtb }}" \
              -print \
              -quit
          )"

          if [ -z "$DTB" ]; then
            echo "::error::DTB tidak ditemukan:"
            echo "${{ inputs.dtb }}"

            echo
            echo "DTB tersedia:"

            find \
              dtb-files \
              -type f \
              -name "*.dtb" \
              -print \
              | sort \
              | sed -n '1,200p'

            exit 1
          fi

          echo
          echo "DTB:"
          ls -lh "$DTB"

          # Modules wajib ada
          if [ ! -d "modules-files/6.6.66" ]; then
            echo "::error::modules-files/6.6.66 tidak ditemukan."
            exit 1
          fi

          MODULE_COUNT="$(
            find \
              modules-files/6.6.66 \
              -type f \
              -name "*.ko*" \
              -print \
              | wc -l
          )"

          echo
          echo "Jumlah modules: $MODULE_COUNT"

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "::error::Tidak ada kernel module ditemukan."
            exit 1
          fi

          echo
          echo "Custom kernel siap."

  # ================================================================
  # BUILD / REPACK
  # ================================================================

  build:
    name: Build S905X4 Custom 6.6.66
    runs-on: ubuntu-22.04
    needs: prepare

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # DOWNLOAD ROOTFS
      # ------------------------------------------------------------

      - name: 2. Download RootFS artifact
        uses: actions/download-artifact@v4
        with:
          name: s905x4-rootfs
          path: rootfs-package

      # ------------------------------------------------------------
      # CHECK ROOTFS
      # ------------------------------------------------------------

      - name: 3. Verify RootFS
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f rootfs-package/openwrt-rootfs.tar.gz ]; then
            echo "::error::RootFS artifact tidak ditemukan."
            exit 1
          fi

          ls -lh \
            rootfs-package/openwrt-rootfs.tar.gz

      # ------------------------------------------------------------
      # EXTRACT ROOTFS
      # ------------------------------------------------------------

      - name: 4. Extract RootFS
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            rootfs

          sudo tar \
            -xzf \
            rootfs-package/openwrt-rootfs.tar.gz \
            -C rootfs

          echo
          echo "RootFS extracted."

          ls -lah rootfs

      # ------------------------------------------------------------
      # EXTRACT CUSTOM KERNEL
      # ------------------------------------------------------------

      - name: 5. Extract custom kernel packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            kernel-files \
            dtb-files \
            modules-files

          tar \
            -xzf \
            "${KERNEL_DIR}/boot-6.6.66.tar.gz" \
            -C kernel-files

          tar \
            -xzf \
            "${KERNEL_DIR}/dtb-amlogic-6.6.66.tar.gz" \
            -C dtb-files

          tar \
            -xzf \
            "${KERNEL_DIR}/modules-6.6.66.tar.gz" \
            -C modules-files

          echo "Custom kernel packages extracted."

      # ------------------------------------------------------------
      # INSTALL MODULES INTO ROOTFS
      # ------------------------------------------------------------

      - name: 6. Install kernel modules 6.6.66
        shell: bash
        run: |
          set -euo pipefail

          MODULE_SRC="modules-files/6.6.66"

          if [ ! -d "$MODULE_SRC" ]; then
            echo "::error::Module source tidak ditemukan."
            exit 1
          fi

          sudo mkdir -p \
            "rootfs/lib/modules/6.6.66"

          sudo rsync \
            -a \
            "$MODULE_SRC/" \
            "rootfs/lib/modules/6.6.66/"

          echo
          echo "Modules installed."

          MODULE_COUNT="$(
            find \
              rootfs/lib/modules/6.6.66 \
              -type f \
              -name "*.ko*" \
              -print \
              | wc -l
          )"

          echo "Module count: $MODULE_COUNT"

          find \
            rootfs/lib/modules/6.6.66 \
            -type f \
            -name "*.ko*" \
            -print \
            | sort \
            | sed -n '1,100p'

      # ------------------------------------------------------------
      # PREPARE BOOT DIRECTORY
      # ------------------------------------------------------------

      - name: 7. Prepare boot directory
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p \
            rootfs/boot

          echo "Boot directory:"
          ls -lah rootfs/boot

      # ------------------------------------------------------------
      # INSTALL VMLINUX
      # ------------------------------------------------------------

      - name: 8. Install custom kernel 6.6.66
        shell: bash
        run: |
          set -euo pipefail

          VMLINUZ="$(
            find \
              kernel-files \
              -type f \
              -name "vmlinuz-6.6.66" \
              -print \
              -quit
          )"

          if [ -z "$VMLINUZ" ]; then
            echo "::error::vmlinuz-6.6.66 tidak ditemukan."
            exit 1
          fi

          echo "Installing:"
          echo "$VMLINUZ"

          sudo cp \
            -f \
            "$VMLINUZ" \
            rootfs/boot/vmlinuz-6.6.66

          # System.map jika tersedia
          SYSTEM_MAP="$(
            find \
              kernel-files \
              -type f \
              -name "System.map-6.6.66" \
              -print \
              -quit
          )"

          if [ -n "$SYSTEM_MAP" ]; then
            sudo cp \
              -f \
              "$SYSTEM_MAP" \
              rootfs/boot/System.map-6.6.66
          fi

          # Config jika tersedia
          CONFIG_FILE="$(
            find \
              kernel-files \
              -type f \
              -name "config-6.6.66" \
              -print \
              -quit
          )"

          if [ -n "$CONFIG_FILE" ]; then
            sudo cp \
              -f \
              "$CONFIG_FILE" \
              rootfs/boot/config-6.6.66
          fi

          echo
          echo "Kernel installed:"

          ls -lh \
            rootfs/boot/*6.6.66* \
            2>/dev/null || true

      # ------------------------------------------------------------
      # INSTALL DTB
      # ------------------------------------------------------------

      - name: 9. Install S905X4 DTB
        shell: bash
        run: |
          set -euo pipefail

          DTB="$(
            find \
              dtb-files \
              -type f \
              -name "${{ inputs.dtb }}" \
              -print \
              -quit
          )"

          if [ -z "$DTB" ]; then
            echo "::error::DTB tidak ditemukan:"
            echo "${{ inputs.dtb }}"
            exit 1
          fi

          echo "Installing DTB:"
          echo "$DTB"

          sudo mkdir -p \
            rootfs/boot/dtb/amlogic

          sudo cp \
            -f \
            "$DTB" \
            "rootfs/boot/dtb/amlogic/${{ inputs.dtb }}"

          sudo cp \
            -f \
            "$DTB" \
            "rootfs/boot/${{ inputs.dtb }}"

          echo
          echo "DTB installed."

          ls -lh \
            "rootfs/boot/dtb/amlogic/${{ inputs.dtb }}"

      # ------------------------------------------------------------
      # MODULE DEPENDENCY FILES
      # ------------------------------------------------------------

      - name: 10. Generate module metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "Generating module dependency files..."

          if [ -x rootfs/sbin/depmod ]; then

            echo "Using OpenWrt depmod."

            sudo chroot \
              rootfs \
              /sbin/depmod \
              -a \
              6.6.66 || true

          else

            echo "Target depmod tidak tersedia."

            echo "Using host depmod."

            sudo depmod \
              -b rootfs \
              6.6.66 || true

          fi

          echo
          echo "Module metadata:"

          find \
            rootfs/lib/modules/6.6.66 \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      # ------------------------------------------------------------
      # CHECK WIFI DRIVER
      # ------------------------------------------------------------

      - name: 11. Check Broadcom WiFi driver
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BROADCOM / AP633I CHECK"
          echo "=========================================="

          echo
          echo "brcmfmac modules:"

          find \
            rootfs/lib/modules/6.6.66 \
            -type f \
            \( \
              -name "brcmfmac*.ko" \
              -o \
              -name "brcmutil*.ko" \
            \) \
            -print \
            | sort

          echo
          echo "Broadcom firmware:"

          find \
            rootfs \
            -type f \
            \( \
              -iname "brcmfmac*.bin" \
              -o \
              -iname "brcmfmac*.txt" \
              -o \
              -iname "brcmfmac*.clm_blob" \
            \) \
            -print \
            | sort \
            | sed -n '1,200p'

      # ------------------------------------------------------------
      # CREATE ROOTFS TAR
      # ------------------------------------------------------------

      - name: 12. Create final rootfs archive
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating final rootfs..."

          sudo tar \
            -C rootfs \
            -czf \
            openwrt-rootfs-s905x4-6.6.66.tar.gz \
            .

          sudo chown \
            "$(id -u):$(id -g)" \
            openwrt-rootfs-s905x4-6.6.66.tar.gz

          ls -lh \
            openwrt-rootfs-s905x4-6.6.66.tar.gz

      # ------------------------------------------------------------
      # REPACK USING OPHUB
      #
      # This follows the successful workflow's repack mechanism.
      # ------------------------------------------------------------

      - name: 13. Repack OpenWrt S905X4
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: "openwrt-rootfs-s905x4-6.6.66.tar.gz"
          openwrt_board: "s905x3-hk1"
          openwrt_kernel: "6.6.y"
          builder_name: ${{ inputs.builder_name }}
          kernel_repo: "ophub/kernel"
          auto_kernel: false
          kernel_usage: "stable"

      # ------------------------------------------------------------
      # SHOW OUTPUT
      # ------------------------------------------------------------

      - name: 14. Show build result
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " BUILD RESULT"
          echo "=========================================="

          echo
          echo "PACKAGED_STATUS:"
          echo "${PACKAGED_STATUS:-not-set}"

          echo
          echo "PACKAGED_OUTPUTPATH:"
          echo "${PACKAGED_OUTPUTPATH:-not-set}"

          echo
          echo "Workspace files:"

          find . \
            -maxdepth 4 \
            -type f \
            -print \
            | sort \
            | sed -n '1,500p'

      # ------------------------------------------------------------
      # UPLOAD OUTPUT
      # ------------------------------------------------------------

      - name: 15. Upload firmware artifact
        if: env.PACKAGED_STATUS == 'success' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-S905X4-Custom-Kernel-6.6.66
          retention-days: 14
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*
