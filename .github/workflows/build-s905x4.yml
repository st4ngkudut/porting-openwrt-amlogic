name: Build OpenWrt S905X4 - Custom Kernel 6.6.66

on:
  workflow_dispatch:
    inputs:
      img_url:
        description: "URL firmware OpenWrt image (.img/.img.gz/.img.xz)"
        required: true
        type: string

      dtb:
        description: "DTB S905X4"
        required: true
        default: "meson-sc2-s905x4-gbit.dtb"
        type: choice
        options:
          - meson-sc2-s905x4-gbit.dtb
          - meson-sc2-s905x4-ah212.dtb

jobs:
  build:
    name: S905X4 / Kernel 6.6.66 / ${{ inputs.dtb }}
    runs-on: ubuntu-22.04

    env:
      TZ: Asia/Jakarta
      KERNEL_VERSION: "6.6.66"
      KERNEL_DIR: "custom-kernel/6.6.66"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # CHECK CUSTOM KERNEL
      # ============================================================

      - name: Check custom kernel files
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Checking custom kernel"
          echo "=========================================="

          REQUIRED_FILES=(
            "${KERNEL_DIR}/boot-6.6.66.tar.gz"
            "${KERNEL_DIR}/dtb-amlogic-6.6.66.tar.gz"
            "${KERNEL_DIR}/modules-6.6.66.tar.gz"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Missing file: $FILE"
              exit 1
            fi

            echo
            echo "Found:"
            ls -lh "$FILE"
          done

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            file \
            gzip \
            xz-utils \
            tar \
            rsync \
            util-linux \
            mount \
            kmod \
            e2fsprogs \
            dosfstools \
            parted \
            gdisk \
            u-boot-tools

      # ============================================================
      # DOWNLOAD SOURCE IMAGE
      # ============================================================

      - name: Download OpenWrt source image
        shell: bash
        run: |
          set -euo pipefail

          URL="${{ inputs.img_url }}"

          echo "=========================================="
          echo " Downloading source image"
          echo "=========================================="

          echo "$URL"

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            "$URL" \
            -o source.download

          echo
          echo "Downloaded:"
          ls -lh source.download

          echo
          echo "File type:"
          file source.download

      # ============================================================
      # DECOMPRESS SOURCE IMAGE
      # ============================================================

      - name: Decompress source image
        shell: bash
        run: |
          set -euo pipefail

          TYPE="$(file -b source.download)"

          echo "Detected image type:"
          echo "$TYPE"

          case "$TYPE" in

            *"gzip compressed data"*)
              mv source.download source.img.gz
              gunzip source.img.gz
              ;;

            *"XZ compressed data"*)
              mv source.download source.img.xz
              unxz source.img.xz
              ;;

            *"disk image"*)
              mv source.download source.img
              ;;

            *"DOS/MBR boot sector"*)
              mv source.download source.img
              ;;

            *"GPT"*)
              mv source.download source.img
              ;;

            *)
              echo "::error::Unknown source image format"
              echo "$TYPE"
              exit 1
              ;;
          esac

          if [ ! -f source.img ]; then
            echo "::error::source.img was not created"
            exit 1
          fi

          echo
          echo "=========================================="
          echo " Source image"
          echo "=========================================="

          ls -lh source.img
          file source.img

      # ============================================================
      # INSPECT SOURCE IMAGE
      # ============================================================

      - name: Inspect source image
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " IMAGE INFORMATION"
          echo "=========================================="

          echo
          echo "--- File ---"
          ls -lh source.img
          file source.img

          echo
          echo "--- fdisk ---"
          sudo fdisk -l source.img || true

          echo
          echo "--- parted ---"
          sudo parted source.img unit MiB print || true

          echo
          echo "--- losetup ---"

          LOOPDEV="$(sudo losetup --find --show --partscan source.img)"

          echo "LOOPDEV=$LOOPDEV" >> "$GITHUB_ENV"

          sleep 2

          echo
          echo "--- lsblk ---"

          lsblk \
            -o NAME,PATH,SIZE,FSTYPE,LABEL,PARTLABEL,PARTTYPE,MOUNTPOINT \
            "$LOOPDEV" || true

          echo
          echo "--- blkid disk ---"

          sudo blkid "$LOOPDEV" || true

          echo
          echo "--- blkid partitions ---"

          for P in "${LOOPDEV}"p*; do
            if [ -b "$P" ]; then
              echo
              echo "Partition: $P"
              sudo blkid "$P" || true
            fi
          done

      # ============================================================
      # EXTRACT CUSTOM KERNEL
      # ============================================================

      - name: Extract custom kernel
        shell: bash
        run: |
          set -euo pipefail

          rm -rf kernel-files
          rm -rf dtb-files
          rm -rf modules-files

          mkdir -p kernel-files
          mkdir -p dtb-files
          mkdir -p modules-files

          echo "=========================================="
          echo " Extracting kernel archive"
          echo "=========================================="

          tar \
            -xzf \
            "${KERNEL_DIR}/boot-6.6.66.tar.gz" \
            -C kernel-files

          echo
          echo "=========================================="
          echo " Extracting DTB archive"
          echo "=========================================="

          tar \
            -xzf \
            "${KERNEL_DIR}/dtb-amlogic-6.6.66.tar.gz" \
            -C dtb-files

          echo
          echo "=========================================="
          echo " Extracting modules archive"
          echo "=========================================="

          tar \
            -xzf \
            "${KERNEL_DIR}/modules-6.6.66.tar.gz" \
            -C modules-files

          echo
          echo "=========================================="
          echo " Kernel files"
          echo "=========================================="

          find kernel-files -type f -print | sort

          echo
          echo "=========================================="
          echo " S905X4 DTB"
          echo "=========================================="

          find dtb-files \
            -type f \
            \( \
              -name "meson-sc2-s905x4-gbit.dtb" \
              -o \
              -name "meson-sc2-s905x4-ah212.dtb" \
            \) \
            -print

          echo
          echo "=========================================="
          echo " Modules sample"
          echo "=========================================="

          # IMPORTANT:
          # sed is used instead of head.
          # head caused SIGPIPE + pipefail.
          find modules-files \
            -type f \
            -print | sort | sed -n '1,100p'

      # ============================================================
      # SELECT DTB
      # ============================================================

      - name: Select S905X4 DTB
        shell: bash
        run: |
          set -euo pipefail

          DTB="$(
            find dtb-files \
              -type f \
              -name "${{ inputs.dtb }}" \
              -print \
              -quit
          )"

          if [ -z "$DTB" ]; then
            echo "::error::Selected DTB not found:"
            echo "${{ inputs.dtb }}"

            echo
            echo "Available DTBs:"

            find dtb-files \
              -type f \
              -name "*.dtb" \
              -print \
              | sort \
              | sed -n '1,200p'

            exit 1
          fi

          echo "DTB_PATH=$DTB" >> "$GITHUB_ENV"

          echo
          echo "Selected DTB:"
          echo "$DTB"

      # ============================================================
      # DETECT PARTITIONS
      # ============================================================

      - name: Detect image partitions
        shell: bash
        run: |
          set -euo pipefail

          LOOPDEV="$LOOPDEV"

          BOOT_PART=""
          ROOT_PART=""

          echo "=========================================="
          echo " Detecting image partitions"
          echo "=========================================="

          echo
          echo "Loop device:"
          echo "$LOOPDEV"

          echo
          echo "All block devices:"

          lsblk \
            -o NAME,PATH,SIZE,FSTYPE,LABEL,PARTLABEL,PARTTYPE,MOUNTPOINT \
            "$LOOPDEV" || true

          echo
          echo "Partition scan:"

          for P in "${LOOPDEV}"p*; do

            [ -b "$P" ] || continue

            INFO="$(sudo blkid "$P" 2>/dev/null || true)"

            echo
            echo "------------------------------------------"
            echo "Partition: $P"
            echo "$INFO"

            # ------------------------------------------------------
            # FAT/VFAT = possible boot partition
            # ------------------------------------------------------

            if echo "$INFO" | grep -Eiq \
              'TYPE="(vfat|fat|fat16|fat32)"'
            then
              if [ -z "$BOOT_PART" ]; then
                BOOT_PART="$P"
              fi
            fi

            # ------------------------------------------------------
            # ext4/f2fs = possible rootfs
            # ------------------------------------------------------

            if echo "$INFO" | grep -Eiq \
              'TYPE="(ext4|f2fs)"'
            then
              if [ -z "$ROOT_PART" ]; then
                ROOT_PART="$P"
              fi
            fi

          done

          echo
          echo "=========================================="
          echo " Detection result"
          echo "=========================================="

          echo "BOOT_PART=${BOOT_PART:-NONE}"
          echo "ROOT_PART=${ROOT_PART:-NONE}"

          if [ -n "$BOOT_PART" ]; then
            echo "BOOT_PART=$BOOT_PART" >> "$GITHUB_ENV"
          else
            echo "BOOT_PART=" >> "$GITHUB_ENV"
          fi

          if [ -n "$ROOT_PART" ]; then
            echo "ROOT_PART=$ROOT_PART" >> "$GITHUB_ENV"
          else
            echo "ROOT_PART=" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # MOUNT ROOTFS
      # ============================================================

      - name: Mount root filesystem
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /mnt/rootfs

          if [ -z "${ROOT_PART:-}" ]; then

            echo "::error::Root filesystem partition was not detected."

            echo
            echo "=========================================="
            echo " IMAGE DEBUG"
            echo "=========================================="

            sudo fdisk -l source.img || true

            echo
            sudo parted source.img unit MiB print || true

            echo
            lsblk \
              -o NAME,PATH,SIZE,FSTYPE,LABEL,PARTLABEL,PARTTYPE,MOUNTPOINT \
              "$LOOPDEV" || true

            exit 1
          fi

          echo "Mounting root filesystem:"
          echo "$ROOT_PART"

          sudo mount "$ROOT_PART" /mnt/rootfs

          echo
          echo "Root filesystem mounted."

          echo
          echo "Root filesystem top-level:"
          sudo ls -lah /mnt/rootfs

      # ============================================================
      # MOUNT BOOT
      # ============================================================

      - name: Mount boot filesystem
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /mnt/boot

          if [ -n "${BOOT_PART:-}" ]; then

            echo "Separate boot partition detected:"
            echo "$BOOT_PART"

            sudo mount "$BOOT_PART" /mnt/boot

          else

            echo "No separate FAT boot partition found."

            if [ -d /mnt/rootfs/boot ]; then

              echo "Using rootfs /boot directory."

              sudo mount \
                --bind \
                /mnt/rootfs/boot \
                /mnt/boot

            else

              echo "::error::No boot partition and no /boot directory."

              echo
              echo "Root filesystem directories:"

              sudo find /mnt/rootfs \
                -maxdepth 2 \
                -type d \
                -print \
                | sort \
                | sed -n '1,200p'

              exit 1
            fi

          fi

          echo
          echo "=========================================="
          echo " BOOT CONTENT"
          echo "=========================================="

          sudo find /mnt/boot \
            -maxdepth 3 \
            -type f \
            -print \
            | sort \
            | sed -n '1,300p'

      # ============================================================
      # BACKUP ORIGINAL BOOT
      # ============================================================

      - name: Backup original boot files
        shell: bash
        run: |
          set -euo pipefail

          sudo mkdir -p /mnt/boot/original-boot

          sudo rsync \
            -a \
            --exclude="original-boot" \
            /mnt/boot/ \
            /mnt/boot/original-boot/

          echo "Original boot files backed up."

      # ============================================================
      # INSTALL CUSTOM KERNEL
      # ============================================================

      - name: Install kernel 6.6.66
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Installing kernel 6.6.66"
          echo "=========================================="

          echo
          echo "Available kernel files:"

          find kernel-files \
            -type f \
            -print \
            | sort

          echo

          # ------------------------------------------------------
          # Locate archive root.
          # ------------------------------------------------------

          KROOT="$(
            find kernel-files \
              -type d \
              -name "boot-6.6.66" \
              -print \
              -quit
          )"

          if [ -z "$KROOT" ]; then
            KROOT="kernel-files"
          fi

          echo "Kernel root:"
          echo "$KROOT"

          # ------------------------------------------------------
          # Install known files.
          # ------------------------------------------------------

          FILES=(
            "vmlinuz-6.6.66"
            "uInitrd-6.6.66"
            "initrd.img-6.6.66"
            "config-6.6.66"
            "System.map-6.6.66"
          )

          for FILE in "${FILES[@]}"; do

            if [ -f "$KROOT/$FILE" ]; then

              echo
              echo "Installing:"
              echo "$FILE"

              sudo cp \
                -f \
                "$KROOT/$FILE" \
                "/mnt/boot/$FILE"

            fi

          done

          echo
          echo "Installed custom kernel files:"

          sudo find /mnt/boot \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*6.6.66*" \
            \) \
            -print \
            | sort

      # ============================================================
      # INSTALL DTB
      # ============================================================

      - name: Install S905X4 DTB
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Installing S905X4 DTB"
          echo "=========================================="

          echo "DTB:"
          echo "$DTB_PATH"

          sudo mkdir -p \
            /mnt/boot/dtb/amlogic

          sudo cp \
            -f \
            "$DTB_PATH" \
            "/mnt/boot/dtb/amlogic/${{ inputs.dtb }}"

          sudo cp \
            -f \
            "$DTB_PATH" \
            "/mnt/boot/${{ inputs.dtb }}"

          echo
          echo "DTB installed."

          ls -lh \
            "/mnt/boot/dtb/amlogic/${{ inputs.dtb }}"

          ls -lh \
            "/mnt/boot/${{ inputs.dtb }}"

      # ============================================================
      # INSTALL MODULES
      # ============================================================

      - name: Install modules 6.6.66
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Installing modules 6.6.66"
          echo "=========================================="

          MODULE_ROOT="modules-files/6.6.66"

          if [ ! -d "$MODULE_ROOT" ]; then

            echo "::error::Module directory not found:"
            echo "$MODULE_ROOT"

            echo
            echo "Available module files:"

            find modules-files \
              -maxdepth 4 \
              -print \
              | sort \
              | sed -n '1,300p'

            exit 1
          fi

          sudo mkdir -p \
            /mnt/rootfs/lib/modules/6.6.66

          sudo rsync \
            -a \
            "$MODULE_ROOT/" \
            "/mnt/rootfs/lib/modules/6.6.66/"

          echo
          echo "Modules installed."

          echo
          echo "Module count:"

          find "/mnt/rootfs/lib/modules/6.6.66" \
            -type f \
            -name "*.ko*" \
            -print \
            | wc -l

          echo
          echo "Module sample:"

          find "/mnt/rootfs/lib/modules/6.6.66" \
            -type f \
            -name "*.ko*" \
            -print \
            | sort \
            | sed -n '1,100p'

      # ============================================================
      # GENERATE MODULE DEPENDENCIES
      # ============================================================

      - name: Generate module dependency
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Generating module dependencies"
          echo "=========================================="

          if [ -x /mnt/rootfs/sbin/depmod ]; then

            echo "Using target depmod."

            sudo chroot \
              /mnt/rootfs \
              /sbin/depmod \
              -a \
              6.6.66 || true

          else

            echo "Target depmod not found."

            echo "Using host depmod."

            sudo depmod \
              -b /mnt/rootfs \
              6.6.66 || true

          fi

          echo
          echo "Module metadata:"

          sudo find \
            /mnt/rootfs/lib/modules/6.6.66 \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      # ============================================================
      # INSPECT BOOT CONFIG
      # ============================================================

      - name: Inspect boot configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " BOOT CONFIGURATION"
          echo "=========================================="

          echo
          echo "--- Boot files ---"

          sudo find /mnt/boot \
            -maxdepth 3 \
            -type f \
            -print \
            | sort \
            | sed -n '1,400p'

          echo
          echo "--- extlinux ---"

          if [ -d /mnt/boot/extlinux ]; then

            sudo find /mnt/boot/extlinux \
              -maxdepth 2 \
              -type f \
              -print \
              | sort \
              | while IFS= read -r FILE; do

                echo
                echo "----- $FILE -----"

                sudo sed \
                  -n '1,240p' \
                  "$FILE"

              done

          fi

          echo
          echo "--- uEnv.txt ---"

          if [ -f /mnt/boot/uEnv.txt ]; then

            sudo sed \
              -n '1,240p' \
              /mnt/boot/uEnv.txt

          fi

          echo
          echo "--- boot.cmd ---"

          if [ -f /mnt/boot/boot.cmd ]; then

            sudo sed \
              -n '1,240p' \
              /mnt/boot/boot.cmd

          fi

      # ============================================================
      # PRESERVE ORIGINAL BOOT LOGIC
      # ============================================================

      - name: Preserve original boot configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Preserving original boot mechanism"
          echo "=========================================="

          echo
          echo "boot.scr / uEnv / extlinux are NOT replaced."

          echo "Custom kernel and DTB have been copied into boot."

          echo
          echo "Custom files:"

          sudo find /mnt/boot \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*6.6.66*" \
              -o \
              -name "${{ inputs.dtb }}" \
            \) \
            -print \
            | sort

      # ============================================================
      # SYNC
      # ============================================================

      - name: Sync filesystem
        shell: bash
        run: |
          set -euo pipefail

          sudo sync

      # ============================================================
      # UNMOUNT
      # ============================================================

      - name: Unmount filesystems
        if: always()
        shell: bash
        run: |
          set +e

          echo "Unmounting..."

          sudo sync

          sudo umount /mnt/boot 2>/dev/null || true
          sudo umount /mnt/rootfs 2>/dev/null || true

          if [ -n "${LOOPDEV:-}" ]; then
            sudo losetup -d "$LOOPDEV" 2>/dev/null || true
          fi

          echo "Unmount completed."

      # ============================================================
      # VERIFY IMAGE
      # ============================================================

      - name: Verify output image
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f source.img ]; then
            echo "::error::source.img does not exist."
            exit 1
          fi

          echo "=========================================="
          echo " FINAL IMAGE"
          echo "=========================================="

          ls -lh source.img

          echo
          file source.img

          echo
          echo "--- Partition table ---"

          sudo fdisk -l source.img || true

      # ============================================================
      # COMPRESS
      # ============================================================

      - name: Compress final image
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="OpenWrt-S905X4-6.6.66-${{ inputs.dtb }}.img.gz"

          echo "Creating:"
          echo "$OUTPUT"

          gzip \
            -1 \
            -c \
            source.img \
            > "$OUTPUT"

          sha256sum "$OUTPUT" > SHA256SUMS

          echo
          echo "=========================================="
          echo " BUILD RESULT"
          echo "=========================================="

          ls -lh "$OUTPUT"

          echo
          cat SHA256SUMS

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-S905X4-6.6.66-${{ inputs.dtb }}
          retention-days: 14
          path: |
            OpenWrt-S905X4-6.6.66-${{ inputs.dtb }}.img.gz
            SHA256SUMS
